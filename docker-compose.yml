services:
  greenmail:
    image: greenmail/standalone:2.1.2
    container_name: vermail-greenmail
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=test:test@localhost,alice:alice@localhost
        -Dgreenmail.users.login=email
        -Dgreenmail.verbose
    ports:
      - "3025:3025" # SMTP
      - "3465:3465" # SMTPS
      - "3110:3110" # POP3
      - "3995:3995" # POP3S
      - "3143:3143" # IMAP
      - "3993:3993" # IMAPS
