name: Vermail

options:
  bundleIdPrefix: com.etherlord
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.9.5"
    CURRENT_PROJECT_VERSION: "8"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    CODE_SIGN_STYLE: Automatic

packages:
  VermailKit:
    path: Packages/VermailKit

targets:
  VermailUpdater:
    type: application
    platform: macOS
    sources:
      - path: VermailUpdater
      - path: Vermail/Updates/UpdateJob.swift
      - path: Vermail/Updates/UpdateReplacer.swift
    settings:
      base:
        PRODUCT_NAME: VermailUpdater
        PRODUCT_BUNDLE_IDENTIFIER: com.etherlord.vermail.updater
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Vermail Update
        INFOPLIST_KEY_LSUIElement: YES
        ENABLE_HARDENED_RUNTIME: YES

  Vermail:
    type: application
    platform: macOS
    sources:
      - path: Vermail
        excludes:
          - "Resources/AppIcon.icon/**"
    postBuildScripts:
      - name: Compile Tahoe app icon
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          out="${DERIVED_FILE_DIR}/TahoeIcon"
          rm -rf "${out}"
          mkdir -p "${out}"
          xcrun actool \
            "${SRCROOT}/Vermail/Resources/Assets.xcassets" \
            "${SRCROOT}/Vermail/Resources/AppIcon.icon" \
            --compile "${out}" \
            --app-icon AppIcon \
            --include-all-app-icons \
            --platform macosx \
            --target-device mac \
            --minimum-deployment-target "${MACOSX_DEPLOYMENT_TARGET}" \
            --output-partial-info-plist "${out}/partial.plist"
          resources="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          cp "${out}/Assets.car" "${resources}/Assets.car"
          cp "${out}/AppIcon.icns" "${resources}/AppIcon.icns"
    dependencies:
      - package: VermailKit
        products: [MailCore, MailTransport, POP3Kit, IMAPKit, SMTPKit, MIMEKit, MailStorage]
      - target: VermailUpdater
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_NAME: Vermail
        PRODUCT_BUNDLE_IDENTIFIER: com.etherlord.vermail
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Vermail
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        CODE_SIGN_ENTITLEMENTS: Vermail/Vermail.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES

  VermailTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: VermailTests
    dependencies:
      - target: Vermail
      - package: VermailKit
        products: [MailCore, MIMEKit, MailStorage, SMTPKit]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.etherlord.vermail.tests

schemes:
  Vermail:
    build:
      targets:
        Vermail: all
        VermailTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VermailTests
      gatherCoverageData: true
