included:
  - Vermail
  - VermailTests
  - Packages/VermailKit/Sources
  - Packages/VermailKit/Tests
  - Packages/VermailKit/Package.swift

excluded:
  - Packages/VermailKit/.build

disabled_rules:
  - trailing_comma # SwiftFormat owns formatting
  - opening_brace
  - optional_data_string_conversion # mail servers send non-UTF-8 bytes; lossy decoding is intended

opt_in_rules:
  - empty_count
  - first_where

analyzer_rules:
  - unused_import

line_length:
  warning: 120
  ignores_comments: true

identifier_name:
  excluded: [id, to, cc, bcc]
